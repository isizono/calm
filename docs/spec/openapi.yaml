# 自動生成ファイル。手動編集しないこと。
# 生成元: scripts/generate_openapi.py（mcp.list_tools() から生成）
# 再生成: uv run python scripts/generate_openapi.py
openapi: 3.0.3
info:
  title: cc-memory MCP server
  version: '0'
  description: |
    cc-memory が提供する MCP ツール群の機械可読仕様。
    MCP は本来 JSON-RPC ベースだが、ここでは OpenAPI 3.0 形式で
    1 ツール = 1 path (POST) として整理する。
    本ファイルは scripts/generate_openapi.py が mcp.list_tools() から自動生成する。
    手動編集は次回生成で失われる。requestBody は実際の引数スキーマそのものだが、
    responses は自動抽出できないため簡略化してある（詳細は docs/spec/mcp-tools.md）。
servers:
- url: mcp://cc-memory
  description: ローカル/HTTP/StreamableHTTP の任意のトランスポートを抽象化した仮想 base URL
tags:
- name: activity
  description: アクティビティの記録・取得・更新
- name: ask
  description: 人間の判断待ちの問いの記録・回答
- name: checkin
  description: アクティビティ check-in
- name: decision
  description: 決定事項の記録・取得
- name: export
  description: 他インスタンスへのexport候補洗い出し・実行
- name: habit
  description: 振る舞いの登録・更新
- name: log
  description: 議論ログの記録・取得
- name: material
  description: 資材の記録・取得・更新
- name: misc
  description: 設定取得・ユーティリティ
- name: pin
  description: pin の追加・削除
- name: relation
  description: エンティティ間リレーション
- name: relay
  description: セッション間メッセージング
- name: retract
  description: 取り消し（論理削除）
- name: search
  description: 横断検索・タグ検索・ID取得
- name: session
  description: 並行セッションの別名管理
- name: tag
  description: タグの更新・分析
- name: timeline
  description: 時系列取得
- name: topic
  description: トピックの記録・取得
paths:
  /tools/add_activity:
    post:
      tags:
      - activity
      summary: 新しいアクティビティを追加する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                title:
                  type: string
                description:
                  type: string
                tags:
                  items:
                    type: string
                  type: array
                related:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  default: null
                pins:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  default: null
                check_in:
                  default: true
                  type: boolean
                orch_managed:
                  default: false
                  type: boolean
              required:
              - title
              - description
              - tags
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_ask:
    post:
      tags:
      - ask
      summary: 人間の判断を待つ問いを1件積む（答え待ちの間、blocksで指定したactivityを止める）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                question:
                  type: string
                blocks:
                  items:
                    type: integer
                  type: array
                tags:
                  items:
                    type: string
                  type: array
                kind:
                  default: ask
                  type: string
                context:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                choices:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  default: null
              required:
              - question
              - blocks
              - tags
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_decisions:
    post:
      tags:
      - decision
      summary: 複数の決定事項を一括記録する（最大10件）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_habit:
    post:
      tags:
      - habit
      summary: エージェントの振る舞いを登録する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                content:
                  type: string
                importance_score:
                  default: 3
                  type: integer
                status:
                  default: active
                  type: string
              required:
              - content
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_logs:
    post:
      tags:
      - log
      summary: 複数のログを一括追加する（最大10件）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_material:
    post:
      tags:
      - material
      summary: 資材を追加する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                title:
                  type: string
                content:
                  type: string
                tags:
                  items:
                    type: string
                  type: array
                source:
                  type: string
                related:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  default: null
              required:
              - title
              - content
              - tags
              - source
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_pin:
    post:
      tags:
      - pin
      summary: pinを追加する（source → target）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                source_type:
                  enum:
                  - tag
                  - activity
                  - topic
                  - decision
                  - log
                  - material
                  type: string
                source_ref:
                  anyOf:
                  - type: integer
                  - type: string
                target_type:
                  enum:
                  - tag
                  - activity
                  - topic
                  - decision
                  - log
                  - material
                  type: string
                target_ref:
                  anyOf:
                  - type: integer
                  - type: string
              required:
              - source_type
              - source_ref
              - target_type
              - target_ref
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_relation:
    post:
      tags:
      - relation
      summary: エンティティ間のリレーションを追加する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                source_type:
                  enum:
                  - topic
                  - activity
                  - material
                  - decision
                  - log
                  type: string
                source_id:
                  type: integer
                targets:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
                relation_type:
                  default: related
                  type: string
              required:
              - source_type
              - source_id
              - targets
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/add_topic:
    post:
      tags:
      - topic
      summary: 新しい議論トピックを追加する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                title:
                  type: string
                description:
                  type: string
                tags:
                  items:
                    type: string
                  type: array
                related:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  default: null
              required:
              - title
              - description
              - tags
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/analyze_tags:
    post:
      tags:
      - tag
      summary: タグの共起分析を実行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                domain:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                include_domain_tags:
                  default: false
                  type: boolean
                focus_tag:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                min_usage:
                  default: 2
                  type: integer
                top_n:
                  default: 20
                  type: integer
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/answer_ask:
    post:
      tags:
      - ask
      summary: 答え待ち（open）のaskに回答する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                ask_id:
                  type: integer
                answer_body:
                  type: string
              required:
              - ask_id
              - answer_body
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/check_in:
    post:
      tags:
      - checkin
      summary: 'Choose: アクティビティに着手するときに関連情報を一括取得したいとき（status を in_progress に自動更新）。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                activity_id:
                  type: integer
                flavor:
                  default: internal
                  enum:
                  - raw
                  - internal
                  - readable
                  type: string
              required:
              - activity_id
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/collect_export_candidates:
    post:
      tags:
      - export
      summary: 'Choose: 他インスタンスへのexport候補を洗い出したいとき。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                roots:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  default: null
                max_depth:
                  default: 2
                  type: integer
                include_types:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  default: null
                tag_roots:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  default: null
                include_snippets:
                  default: true
                  type: boolean
                limit:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
                offset:
                  default: 0
                  type: integer
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/detect_reask_candidates:
    post:
      tags:
      - misc
      summary: 'Choose: sync-memoryの聞き返し後追い検出ステップで使う。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                transcript_path:
                  type: string
                max_candidates:
                  default: 50
                  type: integer
                search_top_n:
                  default: 8
                  type: integer
                search_limit:
                  default: 10
                  type: integer
                score_threshold:
                  default: 0.4
                  type: number
              required:
              - transcript_path
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/export_bundle:
    post:
      tags:
      - export
      summary: 'Choose: collect_export_candidatesで確定した候補リストから、他インスタンスへ渡す'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
                bundle_name:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                include_supersede_targets:
                  default: false
                  type: boolean
                selection:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  default: null
              required:
              - items
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/export_material:
    post:
      tags:
      - material
      summary: 'Choose: 資材の全文を cc-memory 外で参照したい（obsidian vault に置く / docs リポに commit する / third-party
        レビュー用に配布する）とき。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                material_id:
                  type: integer
                dest_path:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
              required:
              - material_id
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_activities:
    post:
      tags:
      - activity
      summary: アクティビティ一覧を取得する（tags/status/orch_managed でフィルタリング可能）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                tags:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  default: null
                status:
                  default: active
                  type: string
                limit:
                  default: 5
                  type: integer
                since:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                until:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                flavor:
                  default: internal
                  enum:
                  - raw
                  - internal
                  - readable
                  type: string
                orch_managed:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  default: null
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_asks:
    post:
      tags:
      - ask
      summary: add_askで記録されたaskを一覧・集計する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                status:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: open
                blocking_activity_id:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
                triage_pending_only:
                  default: false
                  type: boolean
                tags:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  default: null
                kind:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                limit:
                  default: 20
                  type: integer
                offset:
                  default: 0
                  type: integer
                include_stats:
                  default: false
                  type: boolean
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_by_ids:
    post:
      tags:
      - search
      summary: 'Choose: search 結果の type+id ペアを本文付きで一括取得したいとき（複数種別 OK）。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
                flavor:
                  default: internal
                  enum:
                  - raw
                  - internal
                  - readable
                  type: string
              required:
              - items
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_config:
    post:
      tags:
      - misc
      summary: 現在の設定値を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties: {}
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_decisions:
    post:
      tags:
      - decision
      summary: 'Choose: topic/activity に紐づく decision 一覧が欲しいとき。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entity_type:
                  enum:
                  - topic
                  - activity
                  type: string
                entity_id:
                  type: integer
                start_id:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
                limit:
                  default: 30
                  type: integer
                include_retracted:
                  default: false
                  type: boolean
                flavor:
                  default: internal
                  enum:
                  - raw
                  - internal
                  - readable
                  type: string
              required:
              - entity_type
              - entity_id
              type: object
      responses:
        '200':
          description: ツール実行結果。正確な形状は該当ツールのdocstring（src/main.py）または docs/spec/mcp-tools.md を参照
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/ErrorResponse'
  /tools/get_habits:
    post:
      tags:
      - habit
      summary: 登録済みの振る舞い一覧を取得する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                active:
                  default: true
                  type: boolean
                habit_id:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
              type: object
