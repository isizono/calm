openapi: 3.0.3
info:
  title: cc-memory MCP server
  version: "0"
  description: |
    cc-memory が提供する MCP ツール群の機械可読仕様 (v0)。
    MCP は本来 JSON-RPC ベースだが、ここでは OpenAPI 3.0 形式で
    1 ツール = 1 path (POST) として整理する。
    一次情報は src/main.py の @mcp.tool 関数。本ファイルはレビュー・議論用の v0。
servers:
  - url: mcp://cc-memory
    description: ローカル/HTTP/StreamableHTTP の任意のトランスポートを抽象化した仮想 base URL

tags:
  - name: topic
    description: トピックの記録・取得
  - name: log
    description: 議論ログの記録・取得
  - name: decision
    description: 決定事項の記録・取得
  - name: activity
    description: アクティビティの記録・取得・更新
  - name: material
    description: 資材の記録・取得・更新
  - name: search
    description: 横断検索・タグ検索・ID取得
  - name: tag
    description: タグの更新・分析
  - name: relation
    description: エンティティ間リレーション
  - name: pin
    description: pin の追加・削除
  - name: habit
    description: 振る舞いの登録・更新
  - name: timeline
    description: 時系列取得
  - name: checkin
    description: アクティビティ check-in
  - name: retract
    description: 取り消し（論理削除）
  - name: misc
    description: 設定取得・ユーティリティ

paths:
  /tools/add_topic:
    post:
      tags: [topic]
      summary: 新しい議論トピックを追加する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, tags]
              properties:
                title: { type: string }
                description: { type: string }
                tags:
                  type: array
                  items: { type: string }
                  minItems: 1
                related:
                  type: array
                  items: { $ref: '#/components/schemas/RelatedRef' }
                  nullable: true
      responses:
        '200':
          description: 作成された topic と similar_topics
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TopicCreatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'

  /tools/add_logs:
    post:
      tags: [log]
      summary: 複数のログを一括追加 (最大10件)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [topic_id, content]
                    properties:
                      topic_id: { type: integer }
                      content: { type: string }
                      title: { type: string }
                      tags:
                        type: array
                        items: { type: string }
      responses:
        '200':
          description: created と errors の混在配列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateResponse'

  /tools/add_decisions:
    post:
      tags: [decision]
      summary: 複数の決定事項を一括記録 (最大10件)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [topic_id, decision, reason]
                    properties:
                      topic_id: { type: integer }
                      decision: { type: string }
                      reason: { type: string }
                      title: { type: string }
                      tags:
                        type: array
                        items: { type: string }
                      propagate_to:
                        type: object
                        properties:
                          type:
                            type: string
                            enum: [habit, tag_note]
                          content: { type: string }
                          tag: { type: string }
      responses:
        '200':
          description: 作成結果 (related_decisions と hints 付き)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkCreateResponse'
                  - type: object
                    properties:
                      hints:
                        type: array
                        items: { type: string }

  /tools/get_topics:
    post:
      tags: [topic]
      summary: トピックを新しい順に取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
                limit: { type: integer, default: 10 }
                offset: { type: integer, default: 0 }
                since: { type: string, nullable: true, description: "ISO日付" }
                until: { type: string, nullable: true }
      responses:
        '200':
          description: topics 配列と total_count
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items: { $ref: '#/components/schemas/Topic' }
                  total_count: { type: integer }
                  tag_notes:
                    type: array
                    items: { $ref: '#/components/schemas/TagNote' }

  /tools/get_logs:
    post:
      tags: [log]
      summary: 指定エンティティの議論ログを取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type:
                  type: string
                  enum: [topic, activity]
                entity_id: { type: integer }
                start_id: { type: integer, nullable: true }
                limit: { type: integer, default: 30, maximum: 30 }
                include_retracted: { type: boolean, default: false }
      responses:
        '200':
          description: logs 配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/DiscussionLog' }

  /tools/get_decisions:
    post:
      tags: [decision]
      summary: 指定エンティティに関連する決定事項を取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type:
                  type: string
                  enum: [topic, activity]
                entity_id: { type: integer }
                start_id: { type: integer, nullable: true }
                limit: { type: integer, default: 30, maximum: 30 }
                include_retracted: { type: boolean, default: false }
      responses:
        '200':
          description: decisions 配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }

  /tools/pull_precedents:
    post:
      tags: [decision]
      summary: 設計判断前に近傍topicの決定事項を網羅列挙（判例pull）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context:
                  type: string
                  description: これから決めようとしている論点の記述（自由記述、2文字以上）。routingのクエリ兼telemetry用（topic_ids指定時も必須）
                topic_ids:
                  type: array
                  items: { type: integer }
                  nullable: true
                  description: 対象topicを明示指定してroutingをスキップする（embeddingサーバー停止時でも動作する）
                k:
                  type: integer
                  default: 3
                  description: routingで採用するtopic数の上限（1〜5にclamp）
                budget_chars:
                  type: integer
                  nullable: true
                  description: 本文展開の文字数予算。省略時はconfig既定値
                include_materials:
                  type: boolean
                  default: true
                  description: decision/topicに紐づくmaterialカタログを同時展開する（30件で打ち切り、超過時materials_truncated=true）
                flavor:
                  type: string
                  enum: [raw, internal, readable]
                  default: internal
      responses:
        '200':
          description: routingが当たったtopicの非retract decisionを全件（最低でも索引粒度で）列挙
          content:
            application/json:
              schema:
                type: object
                properties:
                  guarantee:
                    type: string
                    enum: [enumerated, routing_miss, routing_unavailable]
                  routing:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum: [vector, explicit, unavailable]
                        description: vector=embedding routingで解決 / explicit=topic_ids指定でrouting skip / unavailable=embeddingサーバー停止でrouting不能
                      candidates:
                        type: array
                        items: { type: object }
                        description: 各要素は{topic_id_raw, title, distance, selected}（explicit時はdistanceなし）。topic_ids指定時に存在しないtopic_idを指定した場合は{topic_id_raw, error:"not_found"}になる
                  topics:
                    type: array
                    items: { $ref: '#/components/schemas/PrecedentTopic' }
                  budget:
                    type: object
                    properties:
                      limit: { type: integer, nullable: true }
                      used: { type: integer }
                      full: { type: integer }
                      index_only: { type: integer }
                  truncated: { type: boolean }
                  materials_truncated: { type: boolean }

  /tools/search:
    post:
      tags: [search]
      summary: キーワードで横断検索 (FTS5 trigram + ベクトル ハイブリッド)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties:
                keyword:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
                entity_type:
                  type: string
                  enum: [topic, decision, activity, log, material]
                  nullable: true
                limit: { type: integer, default: 10, maximum: 50 }
                offset: { type: integer, default: 0 }
                keyword_mode:
                  type: string
                  enum: [and, or]
                  default: and
                include_details: { type: boolean, default: false }
                domain: { type: string, nullable: true }
                date_after: { type: string, nullable: true }
                date_before: { type: string, nullable: true }
                include_retracted: { type: boolean, default: false }
      responses:
        '200':
          description: 検索結果一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }

  /tools/get_by_ids:
    post:
      tags: [search]
      summary: search 結果の詳細を ID 指定で取得 (最大20件)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [topic, decision, activity, log, material]
                      id: { type: integer }
      responses:
        '200':
          description: 各アイテムの詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        id: { type: integer }
                        data: { type: object }

  /tools/search_tags:
    post:
      tags: [tag]
      summary: タグをキーワード検索
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                namespace:
                  type: string
                  nullable: true
                  description: '"domain" | "intent" | "" (空文字=素タグ)'
                include_notes: { type: boolean, default: false }
                limit: { type: integer, default: 20 }
      responses:
        '200':
          description: tags 配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: '#/components/schemas/TagHit' }

  /tools/update_tag:
    post:
      tags: [tag]
      summary: タグの notes/canonical/rename/description を更新 (相互排他)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string }
                notes: { type: string, nullable: true }
                canonical: { type: string, nullable: true }
                rename: { type: string, nullable: true }
                description:
                  type: string
                  nullable: true
                  maxLength: 100
      responses:
        '200':
          description: 更新結果
          content:
            application/json:
              schema: { type: object }

  /tools/analyze_tags:
    post:
      tags: [tag]
      summary: タグ共起分析 (PMI + クラスタ + 孤児 + 重複候補)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string, nullable: true }
                include_domain_tags: { type: boolean, default: false }
                focus_tag: { type: string, nullable: true }
                min_usage: { type: integer, default: 2 }
                top_n: { type: integer, default: 20 }
      responses:
        '200':
          description: 共起・クラスタ・孤児・重複候補
          content:
            application/json:
              schema:
                type: object
                properties:
                  co_occurrences: { type: array }
                  clusters: { type: array }
                  orphans: { type: array }
                  suspected_duplicates: { type: array }

  /tools/add_activity:
    post:
      tags: [activity]
      summary: 新しいアクティビティを追加 (デフォルトで check_in 同時実行)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, tags]
              properties:
                title: { type: string }
                description: { type: string }
                tags:
                  type: array
                  items: { type: string }
                  minItems: 1
                related:
                  type: array
                  items: { $ref: '#/components/schemas/RelatedRef' }
                  nullable: true
                check_in: { type: boolean, default: true }
      responses:
        '200':
          description: 作成された activity と check_in_result
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity: { $ref: '#/components/schemas/Activity' }
                  check_in_result: { $ref: '#/components/schemas/CheckInResult' }

  /tools/get_activities:
    post:
      tags: [activity]
      summary: アクティビティ一覧を status と tags でフィルタ取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
                status:
                  type: string
                  enum: [active, pending, in_progress, completed, snoozed, shelved]
                  default: active
                limit: { type: integer, default: 5 }
                since: { type: string, nullable: true }
                until: { type: string, nullable: true }
      responses:
        '200':
          description: activities と total_count
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
                  total_count: { type: integer }

  /tools/update_activity:
    post:
      tags: [activity]
      summary: アクティビティの status/title/description/tags を更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id]
              properties:
                activity_id: { type: integer }
                status:
                  type: string
                  enum: [pending, in_progress, completed, snoozed, shelved]
                  nullable: true
                title: { type: string, nullable: true }
                description: { type: string, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
                  minItems: 1
      responses:
        '200':
          description: 更新結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }

  /tools/add_material:
    post:
      tags: [material]
      summary: 資材を追加 (独立エンティティ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, tags, source]
              properties:
                title: { type: string }
                content: { type: string }
                tags:
                  type: array
                  items: { type: string }
                  minItems: 1
                source: { type: string }
                related:
                  type: array
                  items: { $ref: '#/components/schemas/RelatedRef' }
                  nullable: true
      responses:
        '200':
          description: 作成された material
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }

  /tools/update_material:
    post:
      tags: [material]
      summary: 資材の content/title/tags/source を更新 (最低1つ指定)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id]
              properties:
                material_id: { type: integer }
                content: { type: string, nullable: true }
                title: { type: string, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
                  minItems: 1
                source: { type: string, nullable: true }
      responses:
        '200':
          description: 更新結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }

  /tools/get_material:
    post:
      tags: [material]
      summary: 資材の全文取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id]
              properties:
                material_id: { type: integer }
      responses:
        '200':
          description: 資材の全文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }

  /tools/check_in:
    post:
      tags: [checkin]
      summary: アクティビティ check-in、関連情報を集約
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id]
              properties:
                activity_id: { type: integer }
      responses:
        '200':
          description: check-in 結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResult' }

  /tools/add_relation:
    post:
      tags: [relation]
      summary: エンティティ間リレーションを追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_id, targets]
              properties:
                source_type:
                  type: string
                  enum: [topic, activity, material, decision, log]
                source_id: { type: integer }
                targets:
                  type: array
                  items: { $ref: '#/components/schemas/RelatedRef' }
                relation_type:
                  type: string
                  enum: [related, depends_on, supersedes]
                  default: related
      responses:
        '200':
          description: 追加件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }

  /tools/remove_relation:
    post:
      tags: [relation]
      summary: エンティティ間リレーションを削除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_id, targets]
              properties:
                source_type:
                  type: string
                  enum: [topic, activity, material, decision, log]
                source_id: { type: integer }
                targets:
                  type: array
                  items: { $ref: '#/components/schemas/RelatedRef' }
                relation_type:
                  type: string
                  enum: [related, depends_on, supersedes]
                  default: related
      responses:
        '200':
          description: 削除件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }

  /tools/get_map:
    post:
      tags: [relation]
      summary: リレーショングラフを走査しカタログを返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type:
                  type: string
                  enum: [topic, activity, material, decision, log]
                entity_id: { type: integer }
                min_depth: { type: integer, default: 0 }
                max_depth: { type: integer, default: 2, maximum: 10 }
      responses:
        '200':
          description: 到達可能エンティティ
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items: { $ref: '#/components/schemas/MapEntity' }
                  total_count: { type: integer }

  /tools/add_habit:
    post:
      tags: [habit]
      summary: 振る舞いを登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: 作成結果
          content:
            application/json:
              schema: { type: object }

  /tools/get_habits:
    post:
      tags: [habit]
      summary: 登録済み振る舞い一覧
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: habits 配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  habits:
                    type: array
                    items: { type: object }

  /tools/update_habit:
    post:
      tags: [habit]
      summary: 振る舞いを更新 (content/active)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [habit_id]
              properties:
                habit_id: { type: integer }
                content: { type: string, nullable: true }
                active: { type: boolean, nullable: true }
      responses:
        '200':
          description: 更新結果
          content:
            application/json:
              schema: { type: object }

  /tools/add_pin:
    post:
      tags: [pin]
      summary: pin を追加 (source → target)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_ref, target_type, target_ref]
              properties:
                source_type:
                  type: string
                  enum: [tag, activity, topic, decision, log, material]
                source_ref:
                  oneOf:
                    - type: integer
                    - type: string
                target_type:
                  type: string
                  enum: [tag, activity, topic, decision, log, material]
                target_ref:
                  oneOf:
                    - type: integer
                    - type: string
      responses:
        '200':
          description: 追加された pin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pin' }

  /tools/remove_pin:
    post:
      tags: [pin]
      summary: pin を削除 (source → target)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_ref, target_type, target_ref]
              properties:
                source_type:
                  type: string
                  enum: [tag, activity, topic, decision, log, material]
                source_ref:
                  oneOf: [{ type: integer }, { type: string }]
                target_type:
                  type: string
                  enum: [tag, activity, topic, decision, log, material]
                target_ref:
                  oneOf: [{ type: integer }, { type: string }]
      responses:
        '200':
          description: 削除件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }

  /tools/retract:
    post:
      tags: [retract]
      summary: 決定事項やログを取り消す (論理削除)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, ids]
              properties:
                entity_type:
                  type: string
                  enum: [decision, log]
                ids:
                  type: array
                  items: { type: integer }
                undo: { type: boolean, default: false }
      responses:
        '200':
          description: 取り消し結果
          content:
            application/json:
              schema: { type: object }

  /tools/get_timeline:
    post:
      tags: [timeline]
      summary: トピックまたはアクティビティの時系列を返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_id: { type: integer, nullable: true }
                activity_id: { type: integer, nullable: true }
                entity_types:
                  type: array
                  items:
                    type: string
                    enum: [decision, log, material]
                  nullable: true
                before: { type: string, nullable: true }
                limit: { type: integer, default: 50, maximum: 100 }
                order:
                  type: string
                  enum: [desc, asc]
                  default: desc
      responses:
        '200':
          description: 時系列要素配列
          content:
            application/json:
              schema: { type: object }

  /tools/get_config:
    post:
      tags: [misc]
      summary: 現在の設定値を返す
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: 設定値
          content:
            application/json:
              schema:
                type: object
                properties:
                  heartbeat_timeout: { type: integer }
                  in_progress_limit: { type: integer }
                  pending_limit: { type: integer }
                  recency_decay_rate: { type: number }
                  sync_disable_retrospective: { type: boolean }
                  sync_policy: { type: string }
                  snapshot_interval_hours: { type: integer }
                  snapshot_max_count: { type: integer }
                  snapshot_anomaly_threshold: { type: number }

  /tools/roll_dice:
    post:
      tags: [misc]
      summary: ダイスを振る (デフォルト 1d10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sides: { type: integer, default: 10 }
      responses:
        '200':
          description: ダイス目
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: integer }

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    BulkCreateResponse:
      type: object
      properties:
        created:
          type: array
          items: { type: object }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              error: { type: object }

    RelatedRef:
      type: object
      required: [type, ids]
      properties:
        type:
          type: string
          enum: [topic, activity, material, decision, log]
        ids:
          type: array
          items: { type: integer }

    Topic:
      type: object
      properties:
        topic_id: { type: integer }
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    TopicCreatedResponse:
      type: object
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        similar_topics:
          type: array
          items:
            type: object
            properties:
              topic_id: { type: integer }
              title: { type: string }
              distance: { type: number }

    DiscussionLog:
      type: object
      properties:
        log_id: { type: integer }
        topic_id: { type: integer }
        title: { type: string }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        retracted_at: { type: string, nullable: true }
        created_at: { type: string }

    Decision:
      type: object
      properties:
        decision_id: { type: integer }
        topic_id: { type: integer }
        title: { type: string }
        decision: { type: string }
        reason: { type: string }
        tags:
          type: array
          items: { type: string }
        related_decisions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              distance: { type: number }
        retracted_at: { type: string, nullable: true }
        created_at: { type: string }

    Activity:
      type: object
      properties:
        activity_id: { type: integer }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [pending, in_progress, completed, snoozed, shelved]
        tags:
          type: array
          items: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    Material:
      type: object
      properties:
        material_id: { type: integer }
        title: { type: string }
        content: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string }

    Pin:
      type: object
      properties:
        source_type: { type: string }
        source_id: { type: integer }
        target_type: { type: string }
        target_id: { type: integer }

    TagHit:
      type: object
      properties:
        tag: { type: string }
        namespace: { type: string }
        score: { type: number }
        notes: { type: string, nullable: true }

    TagNote:
      type: object
      properties:
        tag: { type: string }
        notes: { type: string }

    SearchHit:
      type: object
      properties:
        type:
          type: string
          enum: [topic, decision, activity, log, material]
        id: { type: integer }
        title: { type: string }
        score: { type: number }
        snippet: { type: string }
        tags:
          type: array
          items: { type: string }
        details:
          type: object
          nullable: true

    MapEntity:
      type: object
      properties:
        type: { type: string }
        id: { type: integer }
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        depth: { type: integer }

    CheckInResult:
      type: object
      properties:
        coverage: { type: object }
        activity: { $ref: '#/components/schemas/Activity' }
        related_topics:
          type: array
          items: { type: object }
        related_activities:
          type: array
          items: { type: object }
        pinned:
          type: array
          items: { type: object }
        tag_notes:
          type: array
          items: { $ref: '#/components/schemas/TagNote' }
        materials:
          type: array
          items: { type: object }
        recent_decisions:
          type: array
          items: { type: object }
        latest_log: { type: object, nullable: true }
        logs:
          type: array
          items: { $ref: '#/components/schemas/DiscussionLog' }
        catalog: { type: object }
        summary: { type: string }

    PrecedentTopic:
      type: object
      properties:
        topic_id_raw: { type: integer }
        title: { type: string, nullable: true }
        decisions_total: { type: integer }
        decisions:
          type: array
          items: { type: object }
        materials:
          type: array
          items: { type: object }
