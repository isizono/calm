name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: レビュー対象のPR番号
        required: true
        type: string

jobs:
  claude-review:
    # fork PRではsecretsが配布されずOIDCも無効化されるため認証手段がなく必ず失敗する。
    # fork PRをレビューしたい場合はworkflow_dispatchからPR番号を指定して手動起動する。詳細: #645
    # 手動起動のcheckoutは起動時の--refの中身になる。fork PRはデフォルトブランチから起動し、fork由来のコードをsecretsのある環境に取り込まない。
    # draft PRは除外する。workflow_dispatchにはpull_requestコンテキストが無いため別扱いにする。
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.head.repo.fork && !github.event.pull_request.draft)

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            このPRをレビューして、以下の観点でフィードバックしてください：
            - コード品質とベストプラクティス
            - 潜在的なバグや問題
            - パフォーマンスへの考慮
            - セキュリティ上の懸念
            - テストカバレッジ
            - テスト規約への適合（docs/spec/test-convention.md）

            ## 重要なルール

            レビューは必ず日本語で書いてください。
            問題点・改善提案のみを書いてください。良い点や褒めるコメントは不要です。
            リポジトリのCLAUDE.mdを参照してスタイルと規約に従ってください。

            ### チェックアウトの状態

            workflow_dispatchで起動された場合、作業ディレクトリは起動時の--refの中身であり、PRのheadとは限らない（fork PRはデフォルトブランチから起動する）。変更後の内容は `gh pr diff` で読むこと。

            ### コードを読んで確認してから指摘すること

            diffだけを見て推測で指摘してはいけません。指摘を行う前に、必ず以下の手順を踏んでください：
            1. `Read`や`Grep`ツールを使って、変更箇所の周辺コードや関連ファイルを確認する
            2. 既存の実装パターンやAPI設計と照らし合わせて、本当に問題かどうか判断する
            3. 「理論上問題になりうる」レベルではなく、実際にコードを読んで問題を確認できた場合のみ指摘する

            ### 既存コメントとの重複を避けること

            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || inputs.pr_number }}/comments` で既存のレビューコメントを確認し、同じ指摘を繰り返さないでください。
            また `gh pr view ${{ github.event.pull_request.number || inputs.pr_number }} --comments` でPRコメントも確認してください。

            ### テスト変更を含むPRの確認

            tests/ 配下のファイルを追加・変更するPRでは、docs/spec/test-convention.md（テスト規約）に照らして確認してください。特に:
            - SKILL.md や docs の文言の存在を assert するテストが追加されていないか（規約§2で禁止。許可されるのは実装から期待値を導出する整合性lintと、frontmatter等の構造smokeのみ）
            - 規約§3のアンチパターン（assertion-weak / no-assertion / implementation-mirror / constant-mirror / pr-diff-echo / phrase-pinning）に該当するテストがないか。該当する場合はパターン名を挙げて指摘してください

            skills/ 配下のSKILL.mdのdescription行を変更するPRでは、既存のトリガーフレーズや非発動条件の言及が意図せず失われていないかをdiffで確認してください（この確認はテストではなくレビューの責務です）。

            ## 出力

            `gh pr comment` を使ってBashツールでPRにコメントとしてレビューを残してください。

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          show_full_output: true
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'
