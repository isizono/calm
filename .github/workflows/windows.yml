name: Windows

on:
  push:
    branches: [feat/windows-support]
  pull_request:

jobs:
  windows-repro:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Report Python locale and ANSI codepage
        shell: pwsh
        run: |
          python -c "import locale, sys; print(locale.getencoding(), sys.stdout.encoding, sys.flags.utf8_mode)"
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage | Select-Object ACP, OEMCP

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          save-cache: false
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: uv sync --frozen

      # 各ステップはcontinue-on-errorで通し、Windowsで壊れている箇所の一覧を
      # 1回のCI実行でまとめて取る。最後のSummarizeで全ステップの成否を
      # 集計し、1つでも失敗していればジョブ全体を失敗にする。
      - name: Import src.main succeeds (no POSIX-only top-level imports)
        id: test-import
        continue-on-error: true
        timeout-minutes: 10
        run: uv run pytest tests/windows/test_windows_import.py -v

      - name: Launcher stdio bridge reads initialize without hanging
        id: test-launcher
        continue-on-error: true
        timeout-minutes: 10
        run: uv run pytest tests/windows/test_windows_launcher_stdio.py -v

      - name: DB init and hooks survive a non-UTF-8 locale
        id: test-encoding
        continue-on-error: true
        timeout-minutes: 10
        run: uv run pytest tests/windows/test_windows_encoding.py -v

      - name: hooks.json commands run under PowerShell and Git Bash
        id: test-hooks
        continue-on-error: true
        timeout-minutes: 10
        run: uv run pytest tests/windows/test_windows_hooks.py -v

      - name: Unit tests
        id: test-unit
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -v --tb=short -n auto --durations=25 tests/unit tests/test_migrations tests/services

      - name: Integration/e2e tests
        id: test-integration-e2e
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -v --tb=short -n auto --durations=25 tests/integration tests/e2e

      - name: Summarize results
        if: always()
        shell: pwsh
        run: |
          $steps = @{
            "import src.main"                 = "${{ steps.test-import.outcome }}"
            "launcher stdio bridge"           = "${{ steps.test-launcher.outcome }}"
            "non-UTF-8 locale"                = "${{ steps.test-encoding.outcome }}"
            "hooks.json shell execution"      = "${{ steps.test-hooks.outcome }}"
            "unit tests"                      = "${{ steps.test-unit.outcome }}"
            "integration/e2e tests"           = "${{ steps.test-integration-e2e.outcome }}"
          }
          $failed = @()
          foreach ($name in $steps.Keys) {
            $outcome = $steps[$name]
            "$name : $outcome" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($outcome -ne "success") { $failed += $name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failing groups: $($failed -join ', ')"
            exit 1
          }
