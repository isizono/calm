name: Test

on:
  pull_request:
    # edited を含めるのは、CI fail 後に PR 本文へ例外マーカー
    # ([no-schema-shape-change] 等) を追記したとき lint-docs を再実行させるため。
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            path: tests/unit tests/test_migrations
          - name: integration-e2e
            path: tests/integration tests/e2e

    name: test (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with pytest
        run: uv run pytest -v --tb=short -n auto ${{ matrix.path }}

  lint-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run lint_doc_cochange
        env:
          CCM_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run python scripts/lint_doc_cochange.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  doc-gen-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check docs/spec/openapi.yaml is generated from mcp.list_tools()
        run: uv run python scripts/generate_openapi.py --check

      - name: Check docs/spec/db-schema-tables.md is generated from migrations
        run: uv run python scripts/dump_db_schema.py --check

  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Lint changed migrations for undeclared destructive changes
        run: uv run python scripts/migration_lint.py --changed --base origin/main

      - name: Reject changes to already-applied migrations
        run: |
          changed="$(git diff --name-status origin/main...HEAD -- migrations/ | awk '$1 !~ /^A/ {print}')"
          if [ -n "$changed" ]; then
            echo "migrations/ 配下の既存ファイルへの変更を検出しました(追記オンリー規約違反。新しいmigrationを積んでください):"
            echo "$changed"
            exit 1
          fi
