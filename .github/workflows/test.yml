name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            path: tests/unit
          - name: integration-e2e
            path: tests/integration tests/e2e

    name: test (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with pytest
        run: uv run pytest -v --tb=short -n auto ${{ matrix.path }}

  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Lint changed migrations for undeclared destructive changes
        run: uv run python scripts/migration_lint.py --changed --base origin/main

      - name: Reject changes to already-applied migrations
        run: |
          changed="$(git diff --name-status origin/main...HEAD -- migrations/ | awk '$1 !~ /^A/ {print}')"
          if [ -n "$changed" ]; then
            echo "migrations/ 配下の既存ファイルへの変更を検出しました(追記オンリー規約違反。新しいmigrationを積んでください):"
            echo "$changed"
            exit 1
          fi
