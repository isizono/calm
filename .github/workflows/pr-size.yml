name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同一 PR への連続 push(force-push 含む)で複数実行が並行し、コメント upsert が
# 競合(両方が「既存なし」と判定し二重投稿)するのを防ぐ。古い実行はキャンセルする。
concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # oversized でも成功させ、コメントのみで知らせる。fail に切り替えるとオーバーサイズかつ
  # size-exempt ラベル無しの PR をジョブ失敗にする。
  PR_SIZE_ENFORCE: warn

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PR size check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/pr_size_check.py --ci
