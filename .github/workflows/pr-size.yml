name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # oversized でも成功させ、コメントのみで知らせる。fail に切り替えるとオーバーサイズかつ
  # size-exempt ラベル無しの PR をジョブ失敗にする。
  PR_SIZE_ENFORCE: warn

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PR size check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/pr_size_check.py --ci
